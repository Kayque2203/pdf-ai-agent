<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente de Documentos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="panel panel-docs">
    <div class="brand">
      <span class="brand-mark">§</span>
      <div>
        <h1>Agente de Documentos</h1>
        <p class="subtitle">Envie arquivos ou um link e converse com eles</p>
      </div>
    </div>

    <label class="dropzone" id="dropzone" for="file-input">
      <input type="file" id="file-input" accept=".pdf,.docx,.txt,.md,.csv,.xlsx,.xls" multiple hidden>
      <span class="dropzone-icon">⇧</span>
      <span class="dropzone-text">Solte arquivos aqui ou clique para escolher</span>
      <span class="dropzone-hint">PDF · Word · Excel · CSV · TXT · MD</span>
    </label>

    <div class="url-input-row">
      <input type="url" id="url-input" placeholder="ou cole um link (https://...)">
    </div>

    <button id="index-btn" class="btn-primary" disabled>Indexar documentos</button>

    <div id="file-list" class="file-list"></div>

    <button id="reset-btn" class="btn-secondary" style="display:none;">Esquecer conteúdo atual</button>

    <div id="index-status" class="index-status"></div>
  </aside>

  <main class="panel panel-chat">
    <div id="messages" class="messages">
      <div class="message message-system">
        Envie arquivos (PDF, Word, Excel, CSV, TXT, MD) ou cole um link ao lado, e clique em
        <strong>Indexar documentos</strong>. Depois, pergunte qualquer coisa sobre o conteúdo aqui.
      </div>
    </div>

    <form id="chat-form" class="chat-form">
      <input
        type="text"
        id="chat-input"
        placeholder="Pergunte algo sobre o documento..."
        autocomplete="off"
        disabled
      >
      <button type="submit" id="send-btn" disabled>Enviar</button>
    </form>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
